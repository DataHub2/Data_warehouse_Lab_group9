services:
  dwh_pipeline:
    build:
      context: .
      dockerfile: dockerfile.dwh
    image: flightsacrnasr.azurecr.io/flights-dwh:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # .env points to DAGSTER_HOME at a path on their own machine.
      # While the container has its own, so it will be overridden here.
      DAGSTER_HOME: /pipeline/dagster_home

  dashboard:
    build:
      context: .
      dockerfile: dockerfile.dashboard
    image: flightsacrnasr.azurecr.io/flights-dashboard:latest
    ports:
      - "8501:8501"
    env_file:
      - .env