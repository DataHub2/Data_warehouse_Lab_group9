# No secrets in this file.
# Values are read from environment variables.

data_transformation:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'placeholder') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'placeholder') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/dev/null') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'placeholder') }}"
      warehouse: flights_wh
      database: flights_db
      schema: staging
      threads: 4